name: Desplegar backend PHP por FTP

# Sube la carpeta php/ al hosting por FTPS cada vez que cambie (o manualmente).
# Las credenciales NUNCA van aquí: se leen de los Secrets del repositorio.

on:
  push:
    branches: [main]
    paths:
      - "php/**"
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar config.php desde Secrets
        run: |
          cat > php/config.php <<PHP
          <?php
          return [
              'db_host' => '${{ secrets.DB_HOST }}',
              'db_name' => '${{ secrets.DB_NAME }}',
              'db_user' => '${{ secrets.DB_USER }}',
              'db_pass' => '${{ secrets.DB_PASSWORD }}',
              'generic_password' => '${{ secrets.GENERIC_PASSWORD }}',
              'app_origin' => '${{ secrets.APP_ORIGIN }}',
          ];
          PHP

      - name: Subir php/ por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # Sube el contenido de php/ a la carpeta /api/ del hosting.
          # Ajusta server-dir si tu ruta es otra (p. ej. ./public_html/api/).
          local-dir: ./php/
          server-dir: ./api/
          # Solo gestiona la carpeta /api/ (no toca el resto de tu sitio).
          # Nunca sube secretos ni datos privados:
          exclude: |
            **/clients.csv
            **/config.example.php
            **/clients.example.csv
            **/README.md

      - name: Subir web/ (página principal) a la raíz por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./web/
          server-dir: ./
          state-name: .ftp-deploy-web.json
